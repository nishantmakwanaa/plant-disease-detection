name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME || 'nishantmakwanaa' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Verify Secrets
        run: |
          echo "HF Username: $HF_USERNAME"

          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN missing"
            exit 1
          fi

          echo "HF_TOKEN configured"

      - name: Deploy Updated Code to Hugging Face Space
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone existing Space repo to preserve existing files (such as plant_disease_model_1_latest.pt)
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/plant-disease-detection-app /tmp/hf-space

          # Sync updated backend files without --delete flag so model binaries are NEVER wiped
          rsync -av backend/ /tmp/hf-space/ \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude "model/train_dataset" \
            --exclude "model/datasets" \
            --exclude ".ipynb_checkpoints"

          cd /tmp/hf-space

          git lfs install

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "chore: update backend code from GitHub Actions"
            git push origin main
          else
            echo "No code changes to deploy."
          fi

